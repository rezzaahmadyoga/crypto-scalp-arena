[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-scalp-arena"
version = "0.1.0"
description = "Multi-strategy crypto scalping trading arena with paper trading, AI optimization, and Telegram integration"
requires-python = ">=3.11"
authors = [
    {name = "Crypto Scalp Team", email = "team@cryptoscalp.local"}
]
license = {text = "MIT"}

dependencies = [
    "ccxt>=4.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pandas-ta>=0.3.14b0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "python-telegram-bot>=20.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "APScheduler>=3.10.0",
    "websockets>=12.0",
    "ta-lib>=0.4.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "ipython>=8.0.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
