version: '3.8'\n\nservices:\n  redis:\n    image: redis:7-alpine\n    container_name: crypto-scalp-redis\n    ports:\n      - \"6379:6379\"\n    volumes:\n      - redis_data:/data\n    command: redis-server --appendonly yes\n    healthcheck:\n      test: [\"CMD\", \"redis-cli\", \"ping\"]\n      interval: 5s\n      timeout: 3s\n      retries: 5\n\n  postgres:\n    image: postgres:15-alpine\n    container_name: crypto-scalp-postgres\n    environment:\n      POSTGRES_USER: crypto_user\n      POSTGRES_PASSWORD: crypto_password\n      POSTGRES_DB: crypto_scalp_arena\n    ports:\n      - \"5432:5432\"\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U crypto_user\"]\n      interval: 5s\n      timeout: 3s\n      retries: 5\n\n  data-feed:\n    build:\n      context: .\n      dockerfile: Dockerfile\n    container_name: crypto-scalp-data-feed\n    environment:\n      EXCHANGE_NAME: binance\n      TRADING_SYMBOLS: BTC/USDT,ETH/USDT,BNB/USDT,SOL/USDT,XRP/USDT,ADA/USDT\n      TIMEFRAME: 5m\n      REDIS_URL: redis://redis:6379/0\n      LOG_LEVEL: INFO\n    depends_on:\n      redis:\n        condition: service_healthy\n    command: python -m src.services.data_feed\n    volumes:\n      - ./src:/app/src\n      - ./logs:/app/logs\n\n  arena-manager:\n    build:\n      context: .\n      dockerfile: Dockerfile\n    container_name: crypto-scalp-arena-manager\n    environment:\n      INITIAL_CASH: 1000\n      TRADING_SYMBOLS: BTC/USDT,ETH/USDT,BNB/USDT,SOL/USDT,XRP/USDT,ADA/USDT\n      REDIS_URL: redis://redis:6379/0\n      LOG_LEVEL: INFO\n    depends_on:\n      redis:\n        condition: service_healthy\n    command: python -m src.services.arena_manager\n    volumes:\n      - ./src:/app/src\n      - ./logs:/app/logs\n\n  telegram-service:\n    build:\n      context: .\n      dockerfile: Dockerfile\n    container_name: crypto-scalp-telegram\n    environment:\n      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}\n      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}\n      TELEGRAM_REPORT_INTERVAL: 3600\n      REDIS_URL: redis://redis:6379/0\n      LOG_LEVEL: INFO\n    depends_on:\n      redis:\n        condition: service_healthy\n    command: python -m src.services.telegram_service\n    volumes:\n      - ./src:/app/src\n      - ./logs:/app/logs\n\n  api-server:\n    build:\n      context: .\n      dockerfile: Dockerfile\n    container_name: crypto-scalp-api\n    environment:\n      REDIS_URL: redis://redis:6379/0\n      API_HOST: 0.0.0.0\n      API_PORT: 8000\n      LOG_LEVEL: INFO\n    ports:\n      - \"8000:8000\"\n    depends_on:\n      redis:\n        condition: service_healthy\n    command: python -m src.services.api_server\n    volumes:\n      - ./src:/app/src\n      - ./logs:/app/logs\n\nvolumes:\n  redis_data:\n  postgres_data:\n\nnetworks:\n  default:\n    name: crypto-scalp-network\n
